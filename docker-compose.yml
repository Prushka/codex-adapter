services:
  load-balancer:
    image: meinya/llm-lb:latest
    restart: unless-stopped
    ports:
      - "18081:18081"
    command:
      - -listen
      - 0.0.0.0:18081
      - -attempts
      - "5"
      - -delay
      - 1m
      - -timeout
      - 20m
      - -provider
      - p1,https://provider-one.example.com/v1,sk-provider-one
      - -provider
      - p2,https://provider-two.example.com/v1,sk-provider-two
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
