services:
  load-balancer:
    image: meinya/llm-lb:latest
    restart: unless-stopped
    ports:
      - "18081:18081"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config.yaml:/etc/load-balancer/config.yaml:ro
    command:
      - -listen
      - 0.0.0.0:18081
      - -config
      - /etc/load-balancer/config.yaml
      - -api-key
      - sk-load-balancer
      - -attempts
      - "5"
      - -delay
      - 1m
      - -timeout
      - 30m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
